services:
  postgres:
    image: postgres:16
    container_name: aliados-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aliados
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aliados_postgres_data:/var/lib/postgresql/data

volumes:
  aliados_postgres_data:
