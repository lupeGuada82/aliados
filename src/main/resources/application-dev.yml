spring:
  config:
    import: classpath:application-dev-private.properties
  liquibase:
    enabled: false
    change-log: classpath:db/liquibase/db.changelog.xml
  datasource:
    url: jdbc:postgresql://localhost:5432/aliados
    username: postgres
    password: postgres
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

frontend:
  base-url: http://localhost:4200/

debug: false
