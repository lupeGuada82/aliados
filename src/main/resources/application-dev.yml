spring:
  config:
    import: classpath:application-dev-private.properties
  datasource:
    url: jdbc:postgresql://localhost:5432/aliados
    username: postgres
    password: postgres
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

frontend:
  base-url: http://localhost:4200/

debug: false
