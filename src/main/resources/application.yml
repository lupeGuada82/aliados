spring:
  application:
     #Importante su definición dado que es utilizada por el tracing distribuido
     name: pipers
  liquibase:
     enabled: false
  web:
    cors:
      mappings:
        "/**":
          allowed-origins: "*"
          allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
          allow-credentials: false
  datasource:
    url: jdbc:h2:mem:testdb

  h2:
    console:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: 