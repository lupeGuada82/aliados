spring:
  application:
    #Importante su definición dado que es utilizada por el tracing distribuido
    name: aliados
  liquibase:
    enabled: false
  web:
    cors:
      mappings:
        "/**":
          allowed-origins: "*"
          allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
          allow-credentials: false
  datasource:
    # En producción definir estas variables de entorno o editar esta configuración.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aliados}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /
