spring:
  datasource:
    url: jdbc:h2:mem:pipers
    username: sa
    password: sa
    driverClassName: org.h2.Driver
  h2:
    # default path: h2-console
    console.enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate.ddl-auto: create
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
#      javax:
#        persistence:
#          schema-generation:
#            scripts:
#              create-source: metadata
#              action: create
#              create-target: create.sql
  liquibase:
    enabled: false
  
  config:
    import: classpath:application-dev-private.properties

anthropic:
  model: claude-sonnet-5

springdoc:
  swagger-ui:
    enabled: true

#esto es apra poder realizar el qr dependiendo el ambiente
frontend:
  base-url: http://localhost:4200/#/egresoStock

