spring:
  datasource:
    driver-class-name: org.h2.Driver
    dialect: org.hibernate.dialect.H2Dialect
    url: jdbc:h2:mem:pipers;DB_CLOSE_DELAY=-1;MODE=ORACLE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  resources:
    chain:
      cache: false
  jpa:
    hibernate:
      ddl-auto: none   
      show-sql: true   
   
  h2.console.enabled: false
  h2.console.settings.trace: false
  h2.console.settings.web-allow-others: false
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog.xml 
    user: sa
    password:
    contexts: DESA
              
springdoc:
  swagger-ui:
    enabled: true
