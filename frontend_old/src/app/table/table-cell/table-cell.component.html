<ng-container *ngIf="settings.editable && isEditing; else viewMode">
  <ng-container *ngIf="isColumnEditable(column, row); else viewModeInEditing">
    <ng-container *ngIf="isFormControl(control)">
      <div class="editor-wrapper">
        <text-cell-editor *ngIf="column.editor.type === 'text'" [control]="control" [row]="row" [column]="column"
          (addEditConfirm)="addEditConfirmed()">
        </text-cell-editor>

        <number-cell-editor *ngIf="column.editor.type === 'number'" [control]="control" [row]="row" [column]="column"
          (addEditConfirm)="addEditConfirmed()">
        </number-cell-editor>

        <list-cell-editor *ngIf="column.editor.type === 'list'" [control]="control" [row]="row" [column]="column">
        </list-cell-editor>

        <custom-cell-editor *ngIf="column.editor.type === 'custom'" [control]="control" [row]="row" [column]="column"
          [formGroup]="formGroup" [parameters]="parameters">
        </custom-cell-editor>
        <!-- Errores dinámicos -->
        <div *ngIf="control?.invalid && control?.touched">
          <mat-error *ngFor="let errorKey of errorKeys(control?.errors)" class="error-wrapper">
            {{ column.editor.errorMessages?.[errorKey] || errorKey }}
          </mat-error>
        </div>
        <!-- errores de grupo -->
        <div *ngIf="control.parent?.invalid && (control.touched || control.dirty)" class="error-wrapper">
          <mat-error *ngFor="let key of errorKeys(control.parent?.errors)">
            {{ column.editor.errorMessages?.[key] || key }}
          </mat-error>
        </div>
      </div>
    </ng-container>
  </ng-container>
  <ng-template #viewModeInEditing>
    <div class="view-wrapper wrap-text" [ngClass]="getCellClass()">
      <ng-container *ngIf="column.valueGetter; else defaultDisplay">
        {{ column.valueGetter(formGroup.value) }}
      </ng-container>
      <ng-template #defaultDisplay>
        {{ row[column.key] }}
      </ng-template>
    </div>
  </ng-template>
</ng-container>

<ng-template #viewMode>
  <div class="view-wrapper wrap-text" [ngClass]="getCellClass()">
    <ng-container *ngIf="column.valueGetter; else defaultDisplay">
      {{ column.valueGetter(row) }}
    </ng-container>
    <ng-template #defaultDisplay>
      {{ row[column.key] }}
    </ng-template>
  </div>
</ng-template>
