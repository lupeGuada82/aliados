plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.12'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.0.2'  // Para integrar Node.js
}

group = 'com.demo'
version = '0.0.1-SNAPSHOT'
description = 'Demo para Pipers'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
   // implementation 'org.springframework.boot:spring-boot-starter-security' lo agregue por el manejador de errores pero pide login je
    
    implementation 'org.liquibase:liquibase-core'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    implementation 'com.github.librepdf:openpdf:1.3.30'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// =======================
// Node / Angular integración
// =======================

// Configuración de Node.js y npm
node {
    version = '22.11.0'           // Versión de Node.js
    npmVersion = '9.7.2'          // Versión de npm
    download = true                // Descarga local de Node, no afecta al sistema
    nodeProjectDir = file('frontend')  // Directorio del proyecto Angular
}

// 1️⃣ Task para construir Angular (producción)
// Usa el task npm_run_build que genera el plugin automáticamente
tasks.register('buildAngular') {
    group = 'frontend'
    description = 'Compila Angular para producción'
    dependsOn 'npm_run_build'      // Ejecuta npm run build según tu package.json
}

// 2️⃣ Copiar build Angular al static de Spring Boot
tasks.register('copyAngular', Copy) {
    group = 'frontend'
    description = 'Copia el build de Angular a Spring Boot static'
    from 'frontend/dist/frontend'
    into 'src/main/resources/static'
    dependsOn 'buildAngular'       // Asegura que buildAngular se ejecute primero
}

// 3️⃣ Integración con proceso de recursos de Spring Boot
tasks.named('processResources') {
    dependsOn 'copyAngular'        // Ahora Spring Boot empaqueta Angular automáticamente
}


// Resumen flujo cuando haces ./gradlew build:
// 1. npm ci → Instala dependencias de Angular
// 2. ng build --prod → Compila Angular para producción
// 3. Copia dist → static → Spring Boot empaqueta en el JAR final
