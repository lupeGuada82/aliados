<p>Egreso de Stock!</p>
<form [formGroup]="form" (ngSubmit)="submit()" class="form-container">

  <!-- Código (solo lectura) -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Código</mat-label>
    <input matInput formControlName="codigo" readonly>
  </mat-form-field>

  <!-- Cantidad -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Cantidad</mat-label>
    <input matInput type="number" formControlName="cantidad" min="1">

    <mat-error *ngIf="form.get('cantidad')?.hasError('required')">
      La cantidad es obligatoria
    </mat-error>
    <mat-error *ngIf="form.get('cantidad')?.hasError('min')">
      Debe ser mayor a 0
    </mat-error>
  </mat-form-field>

  <!-- Responsable -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Responsable</mat-label>
    <input matInput formControlName="responsable">

    <mat-error *ngIf="form.get('responsable')?.hasError('required')">
      El responsable es obligatorio
    </mat-error>
  </mat-form-field>

  <!-- Solicitante -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Solicitante</mat-label>
    <input matInput formControlName="solicitante">

    <mat-error *ngIf="form.get('solicitante')?.hasError('required')">
      El solicitante es obligatorio
    </mat-error>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit">
    Guardar
  </button>

</form>
