<div *ngIf="currentSelectedProd; then productoSelected else loadingPage"></div>

<ng-template #loadingPage>
    <p>Cargando producto...</p>
</ng-template>
<ng-template #productoSelected>
    <div class="col-12">
        <div class=" mb-2 mt-1 pointer">
            <span class="link-volver" (click)="atras()">
                <span class="material-icons">arrow_back</span>
                <span>Volver</span>

            </span>
        </div>


        <div class="px-3 d-flex align-items-center gap-2">
            <span class="badge bg-secondary">
                {{ currentSelectedProd.codigo }}
            </span>
            <span class="fw-semibold">
                {{ currentSelectedProd.nombre }}
            </span>
            
        </div>


    </div>
    <div class="px-0 mt-3 ">

        <div class="col-12">

            <mat-tab-group mat-stretch-tabs animationDuration="0ms">


                <!-- SOLAPA ingreso de stock -->
                <mat-tab label="Ingresos de Stock">
                    <table-component [source]="ingresosDeStock" [settings]="settingsIngresos"
                        (editConfirm)="onEditConfirm($event)" (addConfirm)="onAddConfirm($event)"></table-component>
                </mat-tab>
                <mat-tab label="Egresos de Stock">
                    <table-component [source]="egresosDeStock" [settings]="settingsEgresos"
                        (editConfirm)="onEditConfirm($event)" (addConfirm)="onAddConfirm($event)"></table-component>
                </mat-tab>

            </mat-tab-group>

        </div>
    </div>
</ng-template>
