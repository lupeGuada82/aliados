<ng-container *ngIf="settings">
  <div class="acciones-inline">
    <ng-container *ngIf="isEditing">
      <button mat-icon-button class="action-button" (click)="addEditConfirmed(row)" matTooltip="Aceptar">
        <mat-icon>check</mat-icon>
      </button>
      <button mat-icon-button class="action-button" (click)="editCancel(row)" matTooltip="Cancelar">
        <mat-icon>close</mat-icon>
      </button>
    </ng-container>
    <ng-container *ngIf="!isEditing">
      <!-- Mostrar las primeras 4 acciones (según prioridad) -->
      <ng-container *ngFor="let action of allVisibleActions | slice:0:4">
        <button mat-icon-button class="action-button" [matTooltip]="action.label" (click)="action.action()"
          [disabled]="evaluarCondicionDefault(action.disabled, row)">
          <mat-icon [fontSet]="action.fontSet">{{ action.icon }}</mat-icon>
        </button>
      </ng-container>

      <!-- Menú con las restantes -->
      <ng-container *ngIf="allVisibleActions.length > 4">
        <button mat-icon-button [matMenuTriggerFor]="menu" class="defaultActions action-button" matTooltip="Más acciones">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <ng-container *ngFor="let action of allVisibleActions | slice:4">
            <button mat-menu-item (click)="action.action()" [disabled]="evaluarCondicionDefault(action.disabled, row)" class="custom-action-button">
              <mat-icon [fontSet]="action.fontSet">{{ action.icon }}</mat-icon>
              <span class="custom-label">{{ action.label }}</span>
            </button>
          </ng-container>
        </mat-menu>
      </ng-container>
    </ng-container>
  </div>
</ng-container>
