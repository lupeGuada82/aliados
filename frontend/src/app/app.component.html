<block-ui>
  <mat-toolbar color="primary"  [hidden]="!isLoggedIn()">
    <!-- Botón toggle menú -->
    <button mat-icon-button (click)="toggleMenu()" class="menu-toggle-btn icon-color" [disableRipple]="true">
      <mat-icon>menu</mat-icon>
    </button>

    <!-- Logo -->
      <a routerLink="/" class="logo-link">
      <img src="assets/images/pipers.svg" width="35" height="45" loading="auto" class="logo-img">
      <span class="logo-text">Pipers</span>
    </a>
  </mat-toolbar>

  <div class="container"  [hidden]="!isLoggedIn()">
    <!-- Menú lateral -->
    <div class="menu" [class.hidden]="!menuVisible">
      <app-menu></app-menu>
    </div>

    <!-- Contenido central -->
    <div id="routeo">
      <router-outlet></router-outlet>
    </div>
  </div>
</block-ui>
