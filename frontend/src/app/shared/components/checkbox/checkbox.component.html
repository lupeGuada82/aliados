<label class="checkbox"
  [class.checkbox--on-color]="onColor()"
  [class.checkbox--disabled]="disabled()"
  [for]="id"
>
  <input
    #nativeInput
    type="checkbox"
    class="checkbox__input"
    [id]="id"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onChange($event)"
  />

  <span class="checkbox__box">
    <svg class="checkbox__checkmark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path class="checkbox__checkmark-path" d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <svg class="checkbox__indeterminate" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
    </svg>
  </span>

  <span class="checkbox__label">
    <ng-content></ng-content>
  </span>
</label>
