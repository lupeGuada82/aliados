<mat-form-field appearance="outline" class="full-width">

  <mat-chip-grid #chipGrid>
    <mat-chip-row
      *ngFor="let item of selected"
      [removable]="true"
      (removed)="toggle(item)">
      {{ item.label }}
      <mat-icon matChipRemove>cancel</mat-icon>
    </mat-chip-row>

    <input
      matInput
      [formControl]="control"
      [matAutocomplete]="auto"
      placeholder="Seleccionar opciones" />
  </mat-chip-grid>

  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="toggle($event.option.value)">

    <mat-option *ngFor="let option of filteredOptions | async" [value]="option">

      <!-- Checkbox solo como visual, la selección se hace por mat-option -->
      <mat-checkbox [checked]="isSelected(option)">
        {{ option.label }}
      </mat-checkbox>

    </mat-option>

  </mat-autocomplete>

  <mat-hint align="end">
    {{ selected.length }} seleccionados
  </mat-hint>

</mat-form-field>
