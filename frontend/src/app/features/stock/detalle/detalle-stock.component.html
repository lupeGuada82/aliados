@if (currentSelectedProd) {

    <section class="producto-detail-page">

        <!-- Volver -->
        <div class="breadcrumb">
            <app-button
                variant="ghost"
                (click)="atras()"
                icon="arrow_back">
                <span>Volver</span>
            </app-button>
        </div>

        <!-- Información del producto -->
        <div class="product-info">

            <span class="product-code">
                {{ currentSelectedProd.codigo }}
            </span>

            <h1 class="titulo">
                {{ currentSelectedProd.nombre }}
            </h1>

        </div>

        <!-- Tabs -->
        <div class="product-tabs">

            <mat-tab-group
                mat-stretch-tabs
                animationDuration="0ms">

                <!-- Ingresos -->
                <mat-tab label="Ingresos de Stock">

                    <app-table
                        [source]="ingresosDeStock"
                        [settings]="settingsIngresos"
                        (editConfirm)="onEditConfirm($event)"
                        (addConfirm)="onAddConfirm($event)">
                    </app-table>

                </mat-tab>

                <!-- Egresos -->
                <mat-tab label="Egresos de Stock">

                    <app-table
                        [source]="egresosDeStock"
                        [settings]="settingsEgresos"
                        (editConfirm)="onEditConfirm($event)"
                        (addConfirm)="onAddConfirm($event)">
                    </app-table>

                </mat-tab>

            </mat-tab-group>

        </div>

    </section>

} @else {

    <app-loading-overlay message="Cargando producto..." />

}
