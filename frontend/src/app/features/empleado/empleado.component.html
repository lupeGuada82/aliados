
<div class="mb-2 mt-1 breadcrumb">
    <span class="link-volver" (click)="atras()">
        <span class="material-icons">arrow_back</span>
        <span>Volver</span>

    </span>

   
</div>

<div *ngIf="data; then empleadoSelected else loadingPage"></div>

<ng-template #loadingPage>
</ng-template>
<ng-template #empleadoSelected>
    <div>
         <span class="titulo">{{ getTitle() }}</span>
        <div class="d-flex justify-content-end mb-2 mt-1">
  
        </div>
        <table-component [source]="data" [settings]="settings" (editConfirm)="onEditConfirm($event)"
            (addConfirm)="onAddConfirm($event)" ></table-component>

    </div>
</ng-template>
