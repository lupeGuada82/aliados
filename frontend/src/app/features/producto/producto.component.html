<div class="breadcrumb">
    <app-button class="breadcrumb-button" variant="ghost" (click)="atras()" icon="arrow_back">
        <span>Volver</span>
    </app-button>
</div>

@if (data) {
<section class="productos-page">

    <div class="page-header">
        <h1 class="titulo">
            {{ getTitle() }}
        </h1>

        <app-button variant="primary" (click)="cambiarFiltro()" icon="filter_alt">
            <span>Filtrar</span>
        </app-button>
    </div>

    <app-table [source]="data" [settings]="settings">
    </app-table>

</section>
}
@else {

<app-loading-overlay message="Cargando productos..." />

}
