    <div class="upload-container">

        <input #fileInput type="file" accept="application/pdf,image/jpeg,image/png,image/webp"
            (change)="onFileSelected($event)" hidden />

        <app-button variant="secondary" type="button" (click)="fileInput.click()">
            Examinar
        </app-button>

        @if (selectedFile) {
        <span class="file-name">
            {{ selectedFile.name }}
        </span>

        <app-button variant="primary" type="button" [disabled]="processing" (click)="procesarArchivo()">

            @if (processing) {
            Procesando...
            } @else {
            Procesar archivo
            }

        </app-button>
        }
