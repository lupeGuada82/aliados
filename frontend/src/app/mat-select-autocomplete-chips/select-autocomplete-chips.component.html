<mat-form-field [appearance]="appearance" style="width:100%">

  <mat-select
    #selectElem
    [attr.data-cy]="getDataCy()"
    [placeholder]="placeholder"
    [formControl]="formControl"
    [multiple]="multiple"
    (selectionChange)="onSelectionChange($event)"
    (closed)="onClose()">

    <!-- 🔍 BUSCADOR -->
    <div class="box-search">
      <input
        #searchInput
        type="text"
        [formControl]="inputControl"
        [ngClass]="{ 'pl-1': !multiple }"
        [placeholder]="selectPlaceholder"
        (input)="filterItem(searchInput.value)"
        (keydown.space)="$event.stopPropagation()"
      />

      <!-- Select all / deselect all -->
      <div class="box-search-icon" *ngIf="filteredOptions.length > 0">
        <button
          mat-icon-button
          (click)="toggleSelectAll({ checked: !selectAllChecked })"
          [style.color]="selectAllChecked ? 'var(--colorSireco)' : 'var(--grisMedio)'">

          <mat-icon>
            {{ selectAllChecked ? 'indeterminate_check_box' : 'check_box_outline_blank' }}
          </mat-icon>
        </button>
      </div>

      <!-- Clear -->
      <div class="box-search-icon">
        <button
          mat-icon-button
          [disabled]="!searchInput.value"
          (click)="filterItem(''); searchInput.value=''; inputControl.setValue('')"
          [style.color]="searchInput.value ? 'var(--colorSireco)' : 'var(--grisMedio)'">

          <mat-icon>clear</mat-icon>
        </button>
      </div>
    </div>

    <!-- 🏷️ CHIPS EN EL SELECT CERRADO -->
    <mat-select-trigger>

      <mat-chip-set class="chip-list" *ngIf="multiple">

        <mat-chip
          *ngFor="let val of visibleChips"
          [removable]="true"
          (removed)="removeChip(val)">

          {{ getDisplayByValue(val) }}
          <mat-icon matChipRemove>cancel</mat-icon>

        </mat-chip>

        <mat-chip *ngIf="hiddenChipsCount > 0" disabled class="more-chip">
          +{{ hiddenChipsCount }}
        </mat-chip>

      </mat-chip-set>

      <span *ngIf="!multiple">
        {{ getDisplayByValue(selectedValue) }}
      </span>

    </mat-select-trigger>

    <!-- 📋 OPCIONES FILTRADAS -->
    <mat-option
      *ngFor="let option of filteredOptions; trackBy: trackByFn"
      [disabled]="option.disabled"
      [value]="option[value]">

      {{ option[display] }}

    </mat-option>

  </mat-select>

  <mat-hint *ngIf="showErrorMsg" style="color:red">
    {{ errorMsg }}
  </mat-hint>

</mat-form-field>
