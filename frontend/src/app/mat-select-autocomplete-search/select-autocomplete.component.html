<mat-form-field [appearance]="appearance" style="width: 100%;">

    <mat-select [typeaheadDebounceInterval]="20000" [attr.data-cy]="getDataCy()" #selectElem [placeholder]="placeholder"
        [formControl]="formControl" [multiple]="multiple" [(ngModel)]="selectedValue"
        (selectionChange)="onSelectionChange($event)" (closed)="onClose()"><!-- nuevo evento onClose -->
        <div class="box-search" [formGroup]="inputGroup">
            <input #searchInput type="text" formControlName="inputControl" [ngClass]="{ 'pl-1': !multiple }"
                (input)="filterItem(searchInput.value)" [placeholder]="selectPlaceholder"
                (keydown.space)="$event.stopPropagation()" />
            <div class="box-search-icon" title="Deseleccionar todo" *ngIf="selectedValue.length >= 1">
                <button mat-icon-button class="search-button" (click)="toggleSelectAll($event)"
                    style="color: var(--colorSireco);">
                    <mat-icon class="mat-24"> indeterminate_check_box</mat-icon>
                </button>
            </div>
            <div class="box-search-icon" *ngIf="selectedValue.length == 0">
                <button mat-icon-button class="search-button" (click)="toggleSelectAll($event)"
                    style="color: var(--grisMedio);" disabled>
                    <mat-icon class="mat-24"> check_box_outline_blank</mat-icon>
                </button>
            </div>
            <div class="box-search-icon" (click)="filterItem(''); searchInput.value = ''"
                style="color: var(--grisMedio) !important ;" *ngIf="searchInput.value===''">
                <button mat-icon-button class="search-button" disabled>
                    <mat-icon class="mat-24" aria-label="Search icon">clear</mat-icon>
                </button>
            </div>
            <div class="box-search-icon" (click)="filterItem(''); searchInput.value = ''" title="Limpiar busqueda"
                *ngIf="searchInput.value!==''">
                <button mat-icon-button class="search-button"
                    style="color: var(--colorSireco) !important; font-weight: 600;  ">
                    <mat-icon class="mat-24" aria-label="Search icon">clear</mat-icon>
                </button>
            </div>
        </div>
        <!-- <mat-select-trigger>
            {{ onDisplayString() }}
        </mat-select-trigger> -->

        <mat-select-trigger>
            <mat-chip-set class="chip-list" *ngIf="multiple">

                <mat-chip *ngFor="let val of visibleChips" [removable]="true" (removed)="removeChip(val)">
                    {{ getDisplayByValue(val) }}
                    <mat-icon matChipRemove>cancel</mat-icon>
                </mat-chip>

                <mat-chip class="more-chip" *ngIf="hiddenChipsCount > 0" disabled>
                    +{{ hiddenChipsCount }}
                </mat-chip>


            </mat-chip-set>

            <span *ngIf="!multiple">
                {{ getDisplayByValue(selectedValue) }}
            </span>
        </mat-select-trigger>

        <mat-option *ngFor="let option of options; trackBy: trackByFn" [disabled]="option.disabled"
            title="{{option.value}}" [value]="option[value]" [style.display]="hideOption(option) ? 'none' : 'flex'">
            {{ option[display] }}
        </mat-option>
    </mat-select>
    <mat-hint style="color:red" *ngIf="showErrorMsg">{{ errorMsg }}</mat-hint>
</mat-form-field>
