<div class="pt-2 mb-1 px-2">
    <div class="alert alert-info alert-solapa  bg-opacity-90" role="alert" *ngIf="info!=null && info!=''"
    >
     <i class="fas fa-info-circle">
         <span class="pl-1 ">
             {{info}}
         </span>
     </i>
 </div>
    <h2 mat-dialog-title><span style="font-weight: 600;"> {{titulo}} </span>
    </h2>
   
    <mat-dialog-content> {{texto}} </mat-dialog-content>
    
    <mat-dialog-actions style="float: right; margin-top: 30px; margin-bottom: 1px;">
        <button mat-button mat-dialog-close color="dialogo" (click)="confirmar(false)">CANCELAR</button>
        <button mat-button color="oscuro" [mat-dialog-close]="true" cdkFocusInitial
            (click)="confirmar(true)">{{boton}}</button>
    </mat-dialog-actions>
</div>
