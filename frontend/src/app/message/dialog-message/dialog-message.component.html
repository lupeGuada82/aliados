<h1 mat-dialog-title class="text-center">
  <i appDirectivaMessage [tipo]="tipo"></i>
  <div class="h5 mt-3 titulo">{{ titulo }}</div>
</h1>

<div mat-dialog-content class="text-center px-3">
  {{ texto }}
</div>

<div mat-dialog-actions align="center" class="mt-4">
  <button mat-button color="primary" (click)="close()" mat-dialog-close>
    CERRAR
  </button>
</div>
